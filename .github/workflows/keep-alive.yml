name: Supabase Keep-Alive Cron

# Respaldo del Vercel Cron (vercel.json). Supabase pausa los proyectos gratuitos
# con poca actividad durante 7 días; pide "unas cuantas peticiones al día".
on:
  schedule:
    # Dos veces al día: 08:00 y 20:00 UTC (02:00 y 14:00 hora del centro de México)
    - cron: '0 8,20 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a /api/keep-alive (consulta de solo lectura en Supabase)
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://quality-finanzas-cjar.vercel.app/api/keep-alive
